name: Build vrmlx

on:
  push:
    branches: [ main, dev, vrmlproc#* ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ProductionWithBindings]

    env:
      BOOST_VERSION: "1.87.0"
      BOOST_VERSION_UNDERSCORED: "1_87_0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            libgmp-dev \
            libmpfr-dev \
            libcgal-dev \
            python3-dev \
            python3-pip

      - name: Set up Python
        if: matrix.preset == 'ProductionWithBindings'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Boost static
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ~/boost-static
          key: linux-boost-${{ env.BOOST_VERSION }}-static-ubuntu22

      - name: Build Boost static libraries
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          wget -q "https://archives.boost.io/release/${{ env.BOOST_VERSION }}/source/boost_${{ env.BOOST_VERSION_UNDERSCORED }}.tar.gz" -O /tmp/boost.tar.gz
          tar -xzf /tmp/boost.tar.gz -C /tmp
          cd /tmp/boost_${{ env.BOOST_VERSION_UNDERSCORED }}
          ./bootstrap.sh --with-libraries=iostreams,log,date_time,thread,system,filesystem
          ./b2 link=static threading=multi runtime-link=shared variant=release address-model=64 -j$(nproc) --prefix=$HOME/boost-static install

      - name: Set BOOST_ROOT
        run: echo "BOOST_ROOT=$HOME/boost-static" >> $GITHUB_ENV

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmake
            ${{ github.workspace }}/_deps
            ${{ github.workspace }}/out/build/${{ matrix.preset }}/_deps
          key: linux-fetchcontent-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            linux-fetchcontent-${{ matrix.preset }}-
            linux-fetchcontent-

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }} -DBOOST_ROOT="$BOOST_ROOT"

      - name: Build (${{ matrix.preset }})
        run: cmake --build out/build/${{ matrix.preset }} --parallel $(nproc)

      - name: Upload Linux binaries (${{ matrix.preset }})
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/vrmlxConversionApp
            out/build/${{ matrix.preset }}/*.so
            # out/build/${{ matrix.preset }}/vrml_proc/*.so
            # out/build/${{ matrix.preset }}/to_geom/*.so
          if-no-files-found: warn
          retention-days: 7

